[package]
name = "onepixel-manager"
version = "0.1.0"
description = "ONEPIXEL modpack build manager"
authors = ["SparkleSavvy"]
edition = "2021"

[lib]
name = "onepixel_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
  "gzip",
] }
tokio = { version = "1", features = ["macros", "fs", "io-util", "time"] }
futures-util = "0.3"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
